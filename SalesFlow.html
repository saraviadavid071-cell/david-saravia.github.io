<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesFlow Pro - Sistema de Ventas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('inicio');

            // Estado inicial basado en la documentación del examen
            const [productos, setProductos] = useState([
                { id: 1, codigo: '001', nombre: 'Taladro Percutor Industrial 750W', categoria: 'Herramientas Eléctricas', precio: 2500.00, stock: 8 },
                { id: 2, codigo: '002', nombre: 'Martillo de Uña Forjado 16 oz', categoria: 'Herramientas Manuales', precio: 350.00, stock: 15 },
                { id: 3, codigo: '003', nombre: 'Sierra Circular Profesional 7-1/4"', categoria: 'Herramientas Eléctricas', precio: 3800.00, stock: 4 },
                { id: 4, codigo: '004', nombre: 'Juego de Destornilladores Precisión (12 pzas)', categoria: 'Herramientas Manuales', precio: 680.00, stock: 22 },
                { id: 5, codigo: '005', nombre: 'Compresor de Aire Portátil 25L 2HP', categoria: 'Equipos Neumáticos', precio: 5400.00, stock: 3 },
                { id: 6, codigo: '006', nombre: 'Multímetro Digital Autorango True RMS', categoria: 'Medición Eléctrica', precio: 1250.00, stock: 12 }
            ]);

            const [clientes, setClientes] = useState([
                { id: 1, documento: 'J03100004599', nombre: 'Fretería Central', email: 'contacto@ferreteriacentral.com', telefono: '8888-2211', tipo: 'Corporativo' },
                { id: 2, documento: '001-150698-0001A', nombre: 'Constructora del Norte', email: 'ventas@constructoranorte.com', telefono: '8711-3344', tipo: 'Corporativo' }
            ]);

            const [ventas, setVentas] = useState([
                { folio: 'V-0001', fecha: '2026-10-24 10:30', cliente: 'Constructora del Norte', subtotal: 5000.00, iva: 750.00, total: 5750.00 }
            ]);

            // Formulario Nuevo Producto
            const [nuevoProd, setNuevoProd] = useState({ codigo: '', nombre: '', categoria: '', precio: '', stock: '' });
            // Formulario Nuevo Cliente
            const [nuevoCliente, setNuevoCliente] = useState({ documento: '', nombre: '', email: '', telefono: '', tipo: 'Regular' });
            // Formulario Venta POS
            const [ventaForm, setVentaForm] = useState({ clienteId: '', productoId: '', cantidad: 1 });
            const [mensajePOS, setMensajePOS] = useState({ tipo: '', texto: '' });

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab]);

            // --- Lógica de Negocio ---
            const handleAgregarProducto = (e) => {
                e.preventDefault();
                if (!nuevoProd.codigo || !nuevoProd.nombre || !nuevoProd.precio || !nuevoProd.stock) return;
                set([...productos, {
                    id: productos.length + 1,
                    codigo: nuevoProd.codigo,
                    nombre: nuevoProd.nombre,
                    categoria: nuevoProd.categoria || 'General',
                    precio: parseFloat(nuevoProd.precio),
                    stock: parseInt(nuevoProd.stock)
                }]);
                setNuevoProd({ codigo: '', nombre: '', categoria: '', precio: '', stock: '' });
                alert('Producto registrado exitosamente en el catálogo.');
            };

            const handleAgregarCliente = (e) => {
                e.preventDefault();
                if (!nuevoCliente.documento || !nuevoCliente.nombre) return;
                setClientes([...clientes, { id: clientes.length + 1, ...nuevoCliente }]);
                setNuevoCliente({ documento: '', nombre: '', email: '', telefono: '', tipo: 'Regular' });
                alert('Cliente registrado exitosamente.');
            };

            const handleRegistrarVenta = (e) => {
                e.preventDefault();
                setMensajePOS({ tipo: '', texto: '' });

                const clienteObj = clientes.find(c => c.id === parseInt(ventaForm.clienteId));
                const productoObj = productos.find(p => p.id === parseInt(ventaForm.productoId));
                const cantidad = parseInt(ventaForm.cantidad);

                if (!clienteObj || !productoObj || isNaN(cantidad) || cantidad <= 0) {
                    setMensajePOS({ tipo: 'error', texto: 'Seleccione un cliente, un producto y una cantidad válida.' });
                    return;
                }

                // RF-04: Validación de Stock
                if (cantidad > productoObj.stock) {
                    setMensajePOS({ tipo: 'error', texto: `Stock insuficiente. Stock disponible: ${productoObj.stock} unidades.` });
                    return;
                }

                // Descuento automático de stock y cálculo IVA 15%
                const subtotal = productoObj.precio * cantidad;
                const iva = subtotal * 0.15;
                const total = subtotal + iva;

                setProductos(productos.map(p => p.id === productoObj.id ? { ...p, stock: p.stock - cantidad } : p));
                
                const nuevoFolio = `V-00${ventas.length + 1}`;
                const fechaActual = new Date().toISOString().replace('T', ' ').substring(0, 16);
                
                setVentas([{
                    folio: nuevoFolio,
                    fecha: fechaActual,
                    cliente: clienteObj.nombre,
                    subtotal,
                    iva,
                    total
                }, ...ventas]);

                setMensajePOS({ tipo: 'success', texto: `¡Venta registrada con éxito! Folio: ${nuevoFolio} | Total: C$ ${total.toFixed(2)}` });
                setVentaForm({ clienteId: '', productoId: '', cantidad: 1 });
            };

            // Cálculos Dashboard KPI
            const totalFacturado = ventas.reduce((acc, v) => acc + v.total, 0);
            const totalVentas = ventas.length;
            const clientesActivos = clientes.length;
            const stockCriticoCount = productos.filter(p => p.stock <= 5).length;

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Navbar SPA */}
                    <nav className="bg-slate-900 text-white shadow-md sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
                            <div className="flex items-center space-x-3">
                                <span className="bg-blue-600 p-2 rounded-lg font-bold text-lg">SF</span>
                                <span className="font-bold text-xl tracking-wide">SalesFlow Pro</span>
                            </div>
                            <div className="hidden md:flex space-x-1">
                                <button onClick={() => setActiveTab('inicio')} className={`px-4 py-2 rounded-md transition ${activeTab === 'inicio' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800 text-slate-300'}`}>Inicio (Dashboard)</button>
                                <button onClick={() => setActiveTab('productos')} className={`px-4 py-2 rounded-md transition ${activeTab === 'productos' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800 text-slate-300'}`}>Productos</button>
                                <button onClick={() => setActiveTab('clientes')} className={`px-4 py-2 rounded-md transition ${activeTab === 'clientes' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800 text-slate-300'}`}>Clientes</button>
                                <button onClick={() => setActiveTab('ventas')} className={`px-4 py-2 rounded-md transition ${activeTab === 'ventas' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800 text-slate-300'}`}>Ventas (POS)</button>
                                <button onClick={() => setActiveTab('arquitectura')} className={`px-4 py-2 rounded-md transition ${activeTab === 'arquitectura' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800 text-slate-300'}`}>Arquitectura C#</button>
                            </div>
                        </div>
                    </nav>

                    {/* Contenido Principal */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-6">
                        
                        {/* VISTA 1: INICIO / DASHBOARD */}
                        {activeTab === 'inicio' && (
                            <div className="space-y-6">
                                <h1 className="text-2xl font-bold text-slate-800">Dashboard Operativo</h1>
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                        <p className="text-sm font-medium text-slate-500">Ingresos Totales</p>
                                        <h3 className="text-2xl font-bold text-slate-900 mt-1">C$ {totalFacturado.toLocaleString('en-US', {minimumFractionDigits: 2})}</h3>
                                    </div>
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                        <p className="text-sm font-medium text-slate-500">Ventas Realizadas</p>
                                        <h3 className="text-2xl font-bold text-slate-900 mt-1">{totalVentas}</h3>
                                    </div>
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                        <p className="text-sm font-medium text-slate-500">Clientes Activos</p>
                                        <h3 className="text-2xl font-bold text-slate-900 mt-1">{clientesActivos}</h3>
                                    </div>
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-red-500">
                                        <p className="text-sm font-medium text-slate-500">Alertas de Stock Crítico (≤ 5)</p>
                                        <h3 className="text-2xl font-bold text-red-600 mt-1">{stockCriticoCount}</h3>
                                    </div>
                                </div>

                                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                                    <h2 className="text-lg font-semibold text-slate-800 mb-4">Últimas Transacciones Registradas</h2>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase">
                                                    <th className="py-3 px-4">Folio</th>
                                                    <th className="py-3 px-4">Fecha</th>
                                                    <th className="py-3 px-4">Cliente</th>
                                                    <th className="py-3 px-4">Subtotal</th>
                                                    <th className="py-3 px-4">IVA (15%)</th>
                                                    <th className="py-3 px-4">Total</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 text-sm text-slate-700">
                                                {ventas.map((v, i) => (
                                                    <tr key={i} className="hover:bg-slate-50">
                                                        <td className="py-3 px-4 font-medium text-blue-600">{v.folio}</td>
                                                        <td className="py-3 px-4">{v.fecha}</td>
                                                        <td className="py-3 px-4">{v.cliente}</td>
                                                        <td className="py-3 px-4">C$ {v.subtotal.toFixed(2)}</td>
                                                        <td className="py-3 px-4">C$ {v.iva.toFixed(2)}</td>
                                                        <td className="py-3 px-4 font-bold">C$ {v.total.toFixed(2)}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VISTA 2: PRODUCTOS */}
                        {activeTab === 'productos' && (
                            <div className="space-y-6">
                                <h1 className="text-2xl font-bold text-slate-800">Catálogo de Productos</h1>
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-1 h-fit">
                                        <h2 className="text-lg font-semibold text-slate-800 mb-4">Registrar Nuevo Producto</h2>
                                        <form onSubmit={handleAgregarProducto} className="space-y-4">
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Código SKU</label>
                                                <input type="text" value={nuevoProd.codigo} onChange={e=>setNuevoProd({...nuevoProd, codigo: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 text-sm" placeholder="Ej. 007" required />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Nombre del Producto</label>
                                                <input type="text" value={nuevoProd.nombre} onChange={e=>setNuevoProd({...nuevoProd, nombre: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 text-sm" placeholder="Ej. Esmeriladora" required />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Categoría</label>
                                                <input type="text" value={nuevoProd.categoria} onChange={e=>setNuevoProd({...nuevoProd, categoria: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 text-sm" placeholder="Ej. Herramientas Eléctricas" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Precio Unitario (C$)</label>
                                                <input type="number" step="0.01" value={nuevoProd.precio} onChange={e=>setNuevoProd({...nuevoProd, precio: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 text-sm" placeholder="0.00" required />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Stock Inicial</label>
                                                <input type="number" value={nuevoProd.stock} onChange={e=>setNuevoProd({...nuevoProd, stock: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 text-sm" placeholder="0" required />
                                            </div>
                                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition">Guardar Producto</button>
                                        </form>
                                    </div>
                                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 lg:col-span-2">
                                        <h2 className="text-lg font-semibold text-slate-800 mb-4">Inventario Actual</h2>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse">
                                                <thead>
                                                    <tr className="border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase">
                                                        <th className="py-3 px-4">Código</th>
                                                        <th className="py-3 px-4">Producto</th>
                                                        <th className="py-3 px-4">Categoría</th>
                                                        <th className="py-3 px-4">Precio (C$)</th>
                                                        <th className="py-3 px-4">Stock</th>
                                                        <th className="py-3 px-4">Estado</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 text-sm text-slate-700">
                                                    {productos.map((p) => (
                                                        <tr key={p.id} className="hover:bg-slate-50">
                                                            <td className="py-3 px-4 font-medium text-blue-600">{p.codigo}</td>
                                                            <td className="py-3 px-4 font-semibold">{p.nombre}</td>
                                                            <td className="py-3 px-4 text-slate-500">{p.categoria}</td>
                                                            <td className="py-3 px-4">C$ {p.precio.toFixed(2)}</td>
                                                            <td className="py-3 px-4 font-bold">{p.stock}</td>
                                                            <td className="py-3 px-4">
                                                                {p.stock <= 5 ? (
                                                                    <span className="bg-red-100 text-red-700 px-2.5 py-1 rounded-full text-xs font-semibold">Stock Crítico</span>
                                                                ) : (
                                                                    <span className="bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full text-xs font-semibold">Disponible</span>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VISTA 3: CLIENTES */}
                        {activeTab === 'clientes' && (
                            <div className="space-y-6">
                                <h1 className="text-2xl font-bold text-slate-800">Cartera de Clientes</h1>
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-1 h-fit">
                                        <h2 className="text-lg font-semibold text-slate-800 mb-4">Registrar Cliente</h2>
                                        <form onSubmit={handleAgregarCliente} className="space-y-4">
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Cédula / RUC</label>
                                                <input type="text" value={nuevoCliente.documento} onChange={e=>setNuevoCliente({...nuevoCliente, documento: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 text-sm" placeholder="Ej. J031..." required />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Nombre Completo / Empresa</label>
                                                <input type="text" value={nuevoCliente.nombre} onChange={e=>setNuevoCliente({...nuevoCliente, nombre: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 text-sm" placeholder="Ej. Ferretería Central" required />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
                                                <input type="email" value={nuevoCliente.email} onChange={e=>setNuevoCliente({...nuevoCliente, email: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 text-sm" placeholder="correo@dominio.com" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Teléfono</label>
                                                <input type="text" value={nuevoCliente.telefono} onChange={e=>setNuevoCliente({...nuevoCliente, telefono: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 text-sm" placeholder="8888-2211" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Tipo de Cliente</label>
                                                <select value={nuevoCliente.tipo} onChange={e=>setNuevoCliente({...nuevoCliente, tipo: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 text-sm">
                                                    <option value="Regular">Regular</option>
                                                    <option value="Corporativo">Corporativo</option>
                                                </select>
                                            </div>
                                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition">Guardar Cliente</button>
                                        </form>
                                    </div>
                                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 lg:col-span-2">
                                        <h2 className="text-lg font-semibold text-slate-800 mb-4">Directorio de Clientes</h2>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse">
                                                <thead>
                                                    <tr className="border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase">
                                                        <th className="py-3 px-4">Documento</th>
                                                        <th className="py-3 px-4">Nombre / Empresa</th>
                                                        <th className="py-3 px-4">Contacto</th>
                                                        <th className="py-3 px-4">Tipo</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 text-sm text-slate-700">
                                                    {clientes.map((c) => (
                                                        <tr key={c.id} className="hover:bg-slate-50">
                                                            <td className="py-3 px-4 font-medium text-blue-600">{c.documento}</td>
                                                            <td className="py-3 px-4 font-semibold">{c.nombre}</td>
                                                            <td className="py-3 px-4">{c.telefono} <br/><span className="text-xs text-slate-400">{c.email}</span></td>
                                                            <td className="py-3 px-4">
                                                                <span className="bg-slate-100 text-slate-700 px-2.5 py-1 rounded-full text-xs font-semibold">{c.tipo}</span>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VISTA 4: VENTAS (POS) */}
                        {activeTab === 'ventas' && (
                            <div className="space-y-6">
                                <h1 className="text-2xl font-bold text-slate-800">Punto de Venta (POS)</h1>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
                                        <h2 className="text-lg font-semibold text-slate-800 mb-4">Generar Factura</h2>
                                        {mensajePOS.texto && (
                                            <div className={`p-4 mb-4 rounded-lg text-sm font-medium ${mensajePOS.tipo === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`}>
                                                {mensajePOS.texto}
                                            </div>
                                        )}
                                        <form onSubmit={handleRegistrarVenta} className="space-y-4">
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Seleccionar Cliente</label>
                                                <select value={ventaForm.clienteId} onChange={e=>setVentaForm({...ventaForm, clienteId: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 text-sm" required>
                                                    <option value="">-- Elija un cliente --</option>
                                                    {clientes.map(c => <option key={c.id} value={c.id}>{c.nombre} ({c.documento})</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Seleccionar Producto</label>
                                                <select value={ventaForm.productoId} onChange={e=>setVentaForm({...ventaForm, productoId: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 text-sm" required>
                                                    <option value="">-- Elija un producto --</option>
                                                    {productos.map(p => <option key={p.id} value={p.id}>{p.nombre} - C$ {p.precio.toFixed(2)} (Stock: {p.stock})</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Cantidad</label>
                                                <input type="number" min="1" value={ventaForm.cantidad} onChange={e=>setVentaForm({...ventaForm, cantidad: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 text-sm" required />
                                            </div>
                                            <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-lg transition">Registrar Venta y Descontar Stock</button>
                                        </form>
                                    </div>

                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                        <h2 className="text-lg font-semibold text-slate-800 mb-4">Resumen de Facturación en Vivo</h2>
                                        {ventaForm.productoId ? (() => {
                                            const p = productos.find(x => x.id === parseInt(ventaForm.productoId));
                                            const cant = parseInt(ventaForm.cantidad) || 0;
                                            const sub = (p ? p.precio : 0) * cant;
                                            const iv = sub * 0.15;
                                            const tot = sub + iv;
                                            return (
                                                <div className="space-y-3 text-sm bg-slate-50 p-4 rounded-lg border border-slate-200">

                                <p className="text-slate-600 text-sm">Referencia del backend y procedimiento almacenado transaccional ACID especificado en la documentación del proyecto:</p>
                                
                                <div>
                                    <h3 className="font-semibold text-slate-800 mb-2">Endpoint C# de Referencia (.NET 8 Web API)</h3>
                                    <pre className="bg-slate-900 text-slate-200 p-4 rounded-lg text-xs overflow-x-auto">
{`[ApiController]
[Route("api/[controller]")]
public class VentasController : ControllerBase
{
    private readonly SalesFlowDbContext _context;

    public VentasController(SalesFlowDbContext context)
    {
        _context = context;
    }

    [HttpPost]
    public async Task<IActionResult> RegistrarVenta([FromBody] VentaDto dto)
    {
        using var transaction = await _context.Database.BeginTransactionAsync();
        try
        {
            // Ejecución de Transacción atómica (COMMIT / ROLLBACK)
            var resultado = await _context.Database.ExecuteSqlRawAsync(
                "EXEC sp_RegistrarVenta @ClienteID, @ProductoID, @Cantidad",
                new SqlParameter("@ClienteID", dto.ClienteID),
                new SqlParameter("@ProductoID", dto.ProductoID),
                new SqlParameter("@Cantidad", dto.Cantidad)
            );

            await transaction.CommitAsync();
            return Ok(new { mensaje = "Venta registrada e inventario actualizado correctamente." });
        }
        catch (Exception ex)
        {
            await transaction.RollbackAsync();
            return BadRequest(new { error = ex.Message });
        }
    }
}`}
                                    </pre>
